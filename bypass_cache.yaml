# Cache (write path) and bypass (read path), both keyed on _chia_tag.
# The cache never auto-serves: bypass is what turns a hit into a served result,
# which is how a run fast-forwards through work it already did.
#
# Tags set by loop.py:
#   elaborate      -> hw:<hw_hash>
#   build_kernel   -> sw:<sw_hash>
#   simulate       -> sim:<sw_hash>
#   synthesize_recipe -> synr:<hw_hash>@<tech>@<clock_ns>
#   netlist_digest    -> net:<the elaborate tag>
#
# Elaboration carries TWO tag families, not one. `hw:` is a simulator-only
# build; `hwsrc:` is the same build with collect_generated_src and chipyard's
# ENABLE_YOSYS_FLOW on, which produces different (yosys-readable) Verilog. They
# are different artifacts of the same design state and must never satisfy each
# other's cache lookups.
#
# Synthesis is keyed on hw_hash, NOT sw_hash: area and Fmax are properties of
# the hardware alone, so every software-only mutation reuses one synthesis run.
# The technology and clock target are in the key because changing either
# changes the measurement.
#
# The split is the point: a tiling-only mutation changes sw_hash but not
# hw_hash, so it reuses the elaborated RTL and skips the 20-40 minute build.

cache:
  elaborate:
    cache: true
    tags: ["hw:.*", "hwsrc:.*"]
  build_kernel:
    cache: true
    tags: ["sw:.*"]
  simulate:
    cache: true
    tags: ["sim:.*"]
  synthesize_recipe:
    cache: true
    tags: ["synr:.*"]
  # N12b. MUST be registered, and the reason is subtle: netlist_digest reads
  # gen-collateral/ off DISK, and an `elaborate` cache HIT does not rewrite that
  # directory -- so an unregistered netlist_digest re-globs whatever elaborated
  # LAST and reports the previous design's hardware. Sharing elaborate's tag is
  # what makes the digest travel with the artifact. loop.py has passed
  # `_chia_tag=f"net:{hw_tag}"` for exactly this all along; without the entry
  # below the tag did nothing, because chia/base/bypass.py:325 silently treats
  # an unregistered node as never-bypassed.
  #
  # Measured 2026-09-23: the SAME baseline design reported netlist
  # a64e2c09c3b4ebcc under cache (stale) and 6f3c5995546620a3 when genuinely
  # elaborated. The check was reporting on hardware that was never built.
  netlist_digest:
    cache: true
    tags: ["net:.*"]

bypass:
  elaborate:
    bypass: true
    tags: ["hw:.*", "hwsrc:.*"]
  build_kernel:
    bypass: true
    tags: ["sw:.*"]
  simulate:
    bypass: true
    tags: ["sim:.*"]
  synthesize_recipe:
    bypass: true
    tags: ["synr:.*"]
  netlist_digest:
    bypass: true
    tags: ["net:.*"]
